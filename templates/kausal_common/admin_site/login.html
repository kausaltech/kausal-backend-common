{% extends "wagtailadmin/login.html" %}
{% load i18n wagtailadmin_tags %}
{% load static %}

{% block branding_logo %}
    <div class="login-logo">
        <img src="{% static 'images/kausal-avatar-dark-green.svg' %}" alt="Kausal Logo" width="80" />
    </div>
{% endblock %}

{% block branding_login %}{% trans "Sign in to Kausal admin" %}{% endblock %}

{% block above_login %}
<form id="social-login-form" method="post" hidden>
    {% csrf_token %}
    <input type="hidden" name="next" />
    <input type="hidden" name="email" />
</form>
<script type="text/javascript">
    {# FIXME: Hack to bring back deprecated cancelSpinner. Will probably break sooner rather than later. #}
    {# Adapted from https://github.com/wagtail/wagtail/commit/35de8a98b784ce194625662b774ac7364bcf7c17 #}
    document.addEventListener(
      'DOMContentLoaded',
      () => {
        window.cancelSpinner = () => {
          const attr = `data-w-progress-loading-value`;

          document.querySelectorAll(`[${attr}="true"]`).forEach((element) => {
            element.removeAttribute(attr);
          });
        };
      },
      { once: true, passive: true },
    );

const userFoundText = "{% block user_found_text %}{% trans 'Your Kausal admin portal has moved.' %}{% endblock %}";
const redirectingText = "{% trans 'Redirecting to {url} in {count}&nbsp;seconds...' %}";
const goNowText = "{% trans 'Go Now' %}";

function showClusterRedirectNotice(clusterResult) {
    const clusterUrl = clusterResult.cluster_url;
    const redirectUrl = `${clusterUrl}/admin/`;
    const redirectUrlWithState = `${redirectUrl}#from-redirect`;
    let countdown = 10;

    $('.messages').replaceWith(`
        <strong>${userFoundText}</strong><br>
        ${redirectingText.replace('{url}', `<a href="${redirectUrlWithState}">${redirectUrl}</a>`).replace('{count}', `<span id="countdown">${countdown}</span>`)}<br><br>
        <button onclick="window.location.href='${redirectUrlWithState}'" class="button button-small button-secondary">${goNowText}</button>
    `);

    const timer = setInterval(() => {
        countdown--;
        const countdownElement = document.getElementById('countdown');
        if (countdownElement) {
            countdownElement.textContent = countdown;
        }
        if (countdown <= 0) {
            clearInterval(timer);
            window.location.href = redirectUrlWithState;
        }
    }, 1000);
}

    $(function() {
        if (window.location.hash === '#from-redirect') {
            $('.messages').empty().append(`
                <ul>
                    <li class="success">
                        <strong>{% trans "You were successfully redirected" %}</strong><br>
                        {% trans "Please bookmark this page for future use." %}
                    </li>
                </ul>
            `);
            window.history.replaceState({}, document.title, window.location.pathname + window.location.search);
        }

        const setError = (detail) => {
            $('.messages').empty().append(`<ul><li class="error">${detail}</li></ul>`);
        };
        const setUnknownError = () => {
            const msg = "{% trans 'Our apologies, the server is temporarily experiencing difficulties.' %}";
            setError(msg);
        };
        const socialUrlBase = "{% url 'social:begin' 'BACKEND' %}"
        const methodCheckUrl = "{% url 'admin_check_login_method' %}";
        const pwField = $('input#id_password').closest('.w-field__wrapper ');
        const pwInput = pwField.find('input');
        const emailInput = $('input#id_username');
        const resetToggle = $('a.reset-password');
        const rememberMe = $('.remember-me');
        const hiddenEls = [
            pwField,
            resetToggle,
            rememberMe,
        ];
        let emailChecked = false;
        const ITEM_NAME = 'admin-default-email';

        if (!emailInput.val()) {
            const storedEmail = localStorage.getItem(ITEM_NAME);
            if (storedEmail) {
                emailInput.val(storedEmail);
            }
        } else {
            return;
        }

        hiddenEls.forEach((el) => el.hide());
        {% block login_form_setup %}{% endblock %}
        $('.login-form').submit(async (ev) => {
            if (emailChecked || pwField.is(':visible')) {
                return;
            }

            window.localStorage.removeItem(ITEM_NAME);
            ev.preventDefault();
            ev.stopPropagation();

            const form = $(ev.currentTarget).closest('form');
            const email = emailInput.val();
            const next = form.find('input[name="next"]').val();

            const ret = await fetch(methodCheckUrl, {
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({email, next}),
            });
            const resp = await ret.json();
            if (ret.status != 200) {
                const { detail, code } = resp;
                if (detail) {
                    setError(detail);
                } else {
                    setUnknownError();
                }
                setTimeout(() => { window.cancelSpinner() }, 50);
                return;
            }
            const { method, cluster_redirect, cluster_url } = resp;
            if (cluster_redirect) {
                $('button[type="submit"]').hide();
                $('#id_username').closest('.w-field__wrapper').hide();
                showClusterRedirectNotice({ cluster_url });
                return;
            }
            if (!method) {
                setUnknownError();
                return;
            }

            window.localStorage.setItem(ITEM_NAME, email);
            if (method == 'password') {
                hiddenEls.forEach((el) => el.show());
                setTimeout(() => { window.cancelSpinner() }, 50);
            } else {
                const socialForm = document.getElementById('social-login-form');
                socialForm.action = socialUrlBase.replace(/BACKEND/, method);
                socialForm.elements.next.value = next;
                socialForm.elements.email.value = email;
                socialForm.submit();
            }
        });
    })
</script>
{% endblock %}
