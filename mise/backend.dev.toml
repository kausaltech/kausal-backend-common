#:schema https://mise.jdx.dev/schema/mise.json

[settings]
env_cache = true
env_cache_ttl = "8h"
python.uv_venv_auto = "source"
experimental = true

[tools]
prek = "0.5.2"
vault = "2.1.0"
fnox = "1.35.0"

[vars]
product_name = { required = "Set product_name in the product mise config" }
backend_name = { required = "Set backend_name in the product mise config" }
portless_backend_port = { required = "Set portless_backend_port in the product mise config" }
graphql_schema = { required = "Set graphql_schema in the product mise config" }
# The product's package in the optional extensions submodule; empty for none.
extension_package = ""

[env]
SENTRY_ORG = "kausal"
SENTRY_PROJECT = "{{ vars.backend_name }}"
_.python.venv = { path = ".venv", create = true, uv_create_args = [] }
_.fnox-env = { tools = true }

[plugins]
fnox-env = "https://github.com/jdx/mise-env-fnox"

[deps.uv]
auto = false
run = "uv sync --all-groups --all-extras"

[deps.uv-tools]
auto = true
description = "Install development tools with uv"
outputs = [".mise/uv_tools_installed"]
run = "sh -c 'uv tool install pyproject-fmt@latest && echo $(date) >> .mise/uv_tools_installed'"

[tasks.vault-token]
description = "Refresh the Vault token in the keychain"
run = "vault login -address=https://vault.kausal.tech -path=keycloak -method=oidc -token-only | fnox set -p keychain FNOX_VAULT_TOKEN"

[tasks.portless]
description = "Run the backend with Portless"
env = { PORTLESS_WILDCARD = "1", PORTLESS_TLD = "test" }
run = """
echo -en "\\e]2;portless: Kausal {{ vars.product_name }} backend\\a"
portless --name "{{ vars.backend_name }}" --app-port "{{ vars.portless_backend_port }}" kausal_common/development/tools/portless-backend.sh
"""
raw = true

[tasks.export-graphql-schema]
description = "Export the GraphQL schema from the Django project"
run = [
  "mkdir -p __generated__",
  'python manage.py export_schema "{{ vars.graphql_schema }}" > __generated__/schema.graphql',
  'ENABLE_TEST_MODE=1 python manage.py export_schema "{{ vars.graphql_schema }}" > __generated__/schema-test-mode.graphql',
]

[tasks.messages-host]
description = "Update the host project's own translation catalogues"
run = "kausal_common/development/tools/makemessages.sh host"

[tasks.messages-common]
description = "Update the kausal_common translation catalogues"
run = "kausal_common/development/tools/makemessages.sh package kausal_common"

[tasks.messages-extensions]
description = "Update the extensions translation catalogues, if the submodule is checked out"
run = """
d="{{ vars.extension_package }}"
[ -n "$d" ] && [ -d "$d" ] || exit 0
kausal_common/development/tools/makemessages.sh package "$d"
"""

[tasks.messages]
description = "Update all translation catalogues owned by this project"
# Run in sequence: the host extraction briefly deletes the templates of the shared packages.
run = [
  "mise run messages-host",
  "mise run messages-common",
  "mise run messages-extensions",
]
